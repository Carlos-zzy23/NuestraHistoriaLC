<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia 🌷</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2c3e50; }
        .portada-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff8a80, #d32f2f);
            color: white;
            text-align: center;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
            transition: transform 1s ease-in-out;
        }
        h1 { font-family: 'Dancing Script', cursive; font-size: 5rem; margin: 0; text-shadow: 3px 3px 15px rgba(0,0,0,0.3); }
        .libro-icon { font-size: 6rem; margin-bottom: 20px; animation: flotar 3s ease-in-out infinite; }
        @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .btn-abrir {
            margin-top: 30px;
            padding: 15px 40px;
            border: 2px solid white;
            border-radius: 50px;
            font-size: 1.2rem;
            background: transparent;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-abrir:hover { background: white; color: #d32f2f; }
    </style>
</head>
<body>
    <div class="portada-container" onclick="location.href='cuento.html'">
        <div class="libro-icon">📖</div>
        <h1>Nuestra Historia</h1>
        <p style="font-style: italic; font-size: 1.5rem; margin-top: 10px;">"Un amor que empezo raro pero se convirtio en algo muy bonito 🥰​💗​"</p>
        <a href="cuento.html" class="btn-abrir">Abrir Libro</a>
    </div>
</body>
</html>
